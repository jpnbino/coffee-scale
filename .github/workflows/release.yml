name: Release checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tooling:
    name: Tooling tests (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 22 is the minimum supported version; 26 matches the maintainer's Mac.
        node: [22, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  kicad:
    name: KiCad validation and release build
    runs-on: ubuntu-latest
    # Exact patch tags of the official image are locked to one KiCad release.
    # The -full variant ships the 3D model library used by the STEP/GLB exports.
    container:
      image: kicad/kicad:10.0.8-full
      options: --user root
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate (ERC, DRC, parity, dimensions)
        run: node release.mjs --validate-only
      - name: Full prototype release build
        run: node release.mjs
      - name: Locate the portal for GitHub Pages
        id: site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          site=$(ls -d build/releases/*/site | tail -n 1)
          test -f "$site/index.html"
          echo "path=$site" >> "$GITHUB_OUTPUT"
      - name: Package the portal for GitHub Pages
        if: steps.site.outcome == 'success'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ steps.site.outputs.path }}
      - name: Upload build
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-build
          path: build/releases/
          if-no-files-found: warn
          retention-days: 14

  pages:
    name: Publish portal to GitHub Pages
    # Only builds of main are published; pull requests are checked, not deployed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [tooling, kicad]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
