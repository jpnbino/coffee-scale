<text x="660" y="104" text-anchor="middle" font-size="12" font-weight="400" fill="#64716a">GP4/5</text>
<path d="M630 195 L690 195" fill="none" stroke="#244f43" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="660" y="187" text-anchor="middle" font-size="12" font-weight="400" fill="#64716a">GP12</text>
<path d="M630 278 L690 278" fill="none" stroke="#244f43" stroke-width="1.6"/>
<text x="660" y="270" text-anchor="middle" font-size="12" font-weight="400" fill="#64716a">GP0/1</text>
<path d="M400 195 L450 195" fill="none" stroke="#244f43" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="425" y="187" text-anchor="middle" font-size="12" font-weight="400" fill="#64716a">GP8/9</text>
<path d="M400 278 L450 278" fill="none" stroke="#244f43" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="425" y="270" text-anchor="middle" font-size="12" font-weight="400" fill="#64716a">GP10/11/14</text>
<rect x="30" y="380" width="150" height="64" rx="8" fill="#fffef9" stroke="#244f43" stroke-width="1.5"/>
<text x="105.0" y="409.0" text-anchor="middle" font-size="14" font-weight="600" fill="#242b28">USB-C (J1)</text>
<text x="105.0" y="425.0" text-anchor="middle" font-size="12" font-weight="400" fill="#64716a">5 V, power only</text>
<rect x="230" y="380" width="170" height="64" rx="8" fill="#fffef9" stroke="#244f43" stroke-width="1.5"/>
<text x="315.0" y="409.0" text-anchor="middle" font-size="14" font-weight="600" fill="#242b28">Charger + Li cell</text>
<text x="315.0" y="425.0" text-anchor="middle" font-size="12" font-weight="400" fill="#64716a">MCP73831, DW01A</text>
<rect x="450" y="380" width="180" height="64" rx="8" fill="#fffef9" stroke="#98613c" stroke-width="2"/>
<text x="540.0" y="409.0" text-anchor="middle" font-size="14" font-weight="600" fill="#242b28">Power latch + 3.3 V</text>
<text x="540.0" y="425.0" text-anchor="middle" font-size="12" font-weight="400" fill="#64716a">TPS22919, TPS63031</text>
<path d="M180 412 L230 412" fill="none" stroke="#244f43" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M400 412 L450 412" fill="none" stroke="#244f43" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M630 412 L860 412" fill="none" stroke="#244f43" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="745" y="404" text-anchor="middle" font-size="12" font-weight="600" fill="#244f43">3.3 V rail to every block</text>
<path d="M315 310 L315 346 L500 346 L500 380" fill="none" stroke="#244f43" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="408" y="340" text-anchor="middle" font-size="11" font-weight="400" fill="#64716a">wake: centre press</text>
<path d="M580 310 L580 380" fill="none" stroke="#244f43" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="586" y="352" text-anchor="start" font-size="11" font-weight="400" fill="#64716a">PWR_HOLD (GP13)</text>
</svg>
